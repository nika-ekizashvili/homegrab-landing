# Served by nginx:alpine (see Dockerfile). Without this file usectl generated a
# config whose `try_files ... /index.html` answered every unknown address with
# the homepage and a 200 — search engines read those as duplicate pages.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Location headers stay relative, so redirects keep https behind Cloudflare.
    absolute_redirect off;

    # One address per page.
    if ($request_uri = /index.html) { return 301 /; }
    location = /privacy { return 301 /privacy.html; }
    location = /terms   { return 301 /terms.html; }

    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
