# Served by nginx:alpine (see Dockerfile). Without this file usectl generated a
# config whose `try_files ... /index.html` answered every unknown address with
# the homepage and a 200 — search engines read those as duplicate pages.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Location headers stay relative, so redirects keep https behind Cloudflare.
    absolute_redirect off;

    # The old address (until 2026-10-21) still sits in older extensions' links
    # and old shares. It only reaches here while it is attached to this app.
    if ($host = homegrab.usectl.com) { return 301 https://homegrab.ge$request_uri; }

    # One address per page.
    if ($request_uri = /index.html) { return 301 /; }
    location = /privacy { return 301 /privacy.html; }
    location = /terms   { return 301 /terms.html; }
    location = /support { return 301 /support.html; }

    # The subscription terms are rendered by the server from the extension
    # repo's store-assets/subscription-terms-ka.md (one source); shown here
    # under the site's own address. The server keeps /terms for old links.
    location = /subscription-terms {
        proxy_pass https://homegrab-api.usectl.com/terms;
        proxy_set_header Host homegrab-api.usectl.com;
        proxy_ssl_server_name on;
        proxy_ssl_name homegrab-api.usectl.com;
    }

    location / {
        try_files $uri $uri/index.html =404;
    }

    error_page 404 /404.html;
    location = /404.html { internal; }
}
